name: Generate Wirdi Signing Keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore wirdi.keystore \
            -alias wirdi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass wirdi123 -keypass wirdi123 \
            -dname "CN=Wirdi, OU=Dev, O=Wirdi, L=Cairo, S=Cairo, C=EG"

      - name: Show fingerprints (copy SHA1/SHA256 into Firebase Console)
        run: keytool -list -v -keystore wirdi.keystore -alias wirdi -storepass wirdi123

      - name: Base64-encode keystore
        run: base64 -w0 wirdi.keystore > wirdi_keystore_base64.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-keystore
          path: |
            wirdi.keystore
            wirdi_keystore_base64.txt
